name: BarberPro CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # 1. Build and Test verification job
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Validate Frontend compilation
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      # Validate Backend compilation
      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

  # 2. Docker verification and packaging validation job
  docker-validation:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Frontend Image locally to verify compile status
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: barberpro-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Backend Image locally to verify compile status
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: barberpro-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Validate compose parsing and health configurations
      - name: Verify Docker Compose Configuration
        run: docker compose config
